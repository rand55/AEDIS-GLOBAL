<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <marker id="b1" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#e2574c"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0b1116"/>

  <text x="80" y="96" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">The gap nobody notices</text>
  <text x="80" y="140" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="22">Frame 2 — why roads and clinics cannot get an ordinary loan</text>

  <!-- can -->
  <rect x="80" y="200" width="680" height="420" rx="16" fill="#141d26" stroke="#42d6bd" stroke-width="2"/>
  <text x="120" y="256" fill="#42d6bd" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">A BANK CAN LEND AGAINST THIS</text>

  <text x="120" y="316" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="25">· a home</text>
  <text x="120" y="366" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="25">· a factory that sells goods</text>
  <text x="120" y="416" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="25">· a business with revenue</text>
  <text x="120" y="466" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="25">· anything that pays the loan back</text>

  <text x="120" y="552" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="22">The loan is safe because the thing</text>
  <text x="120" y="582" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="22">itself generates the repayment.</text>

  <!-- cannot -->
  <rect x="840" y="200" width="680" height="420" rx="16" fill="#141d26" stroke="#e2574c" stroke-width="2"/>
  <text x="880" y="256" fill="#e2574c" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">A BANK CANNOT LEND AGAINST THIS</text>

  <text x="880" y="316" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="25">· a road</text>
  <text x="880" y="366" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="25">· a clinic or a school</text>
  <text x="880" y="416" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="25">· a water main</text>
  <text x="880" y="466" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="25">· a research programme</text>

  <text x="880" y="552" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="22">Real, necessary, and generating no</text>
  <text x="880" y="582" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="22">receipt of its own. No collateral.</text>

  <!-- consequence -->
  <text x="80" y="700" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="26">So there are only two ways left to build them:</text>

  <rect x="80" y="730" width="330" height="88" rx="12" fill="#141d26" stroke="#f4bd55" stroke-width="2"/>
  <text x="245" y="784" fill="#f4bd55" font-family="Segoe UI, Arial, sans-serif" font-size="26" text-anchor="middle">raise taxes</text>

  <rect x="460" y="730" width="330" height="88" rx="12" fill="#141d26" stroke="#f4bd55" stroke-width="2"/>
  <text x="625" y="784" fill="#f4bd55" font-family="Segoe UI, Arial, sans-serif" font-size="26" text-anchor="middle">borrow, and pay interest</text>

  <line x1="840" y1="774" x2="980" y2="774" stroke="#e2574c" stroke-width="3" marker-end="url(#b1)"/>

  <rect x="1000" y="718" width="520" height="112" rx="12" fill="#0b1116" stroke="#e2574c" stroke-width="2"/>
  <text x="1030" y="762" fill="#e2574c" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">AND WHEN BORROWING STOPS</text>
  <text x="1030" y="800" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="22">the building stops with it</text>

</svg>
