<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <marker id="t1" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8fa6b2"/>
    </marker>
    <marker id="t2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#e2574c"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0b1116"/>

  <text x="70" y="74" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">How it works today</text>
  <text x="70" y="112" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="21">One page. No finance knowledge needed.</text>

  <!-- ROW 1 - three steps -->
  <rect x="70" y="146" width="440" height="132" rx="14" fill="#141d26" stroke="#7c6cff" stroke-width="2"/>
  <text x="96" y="186" fill="#7c6cff" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">STEP 1</text>
  <text x="96" y="222" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="24">The government wants</text>
  <text x="96" y="252" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="24">to build something.</text>

  <line x1="518" y1="212" x2="588" y2="212" stroke="#8fa6b2" stroke-width="3" marker-end="url(#t1)"/>
  <text x="516" y="196" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="16">needs money</text>

  <rect x="598" y="146" width="440" height="132" rx="14" fill="#141d26" stroke="#f4bd55" stroke-width="2"/>
  <text x="624" y="186" fill="#f4bd55" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">STEP 2</text>
  <text x="624" y="222" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="24">It sells bonds: paper</text>
  <text x="624" y="252" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="24">promises with a date.</text>

  <line x1="1046" y1="212" x2="1116" y2="212" stroke="#8fa6b2" stroke-width="3" marker-end="url(#t1)"/>
  <text x="1044" y="196" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="16">the offer</text>

  <rect x="1126" y="146" width="404" height="132" rx="14" fill="#141d26" stroke="#42d6bd" stroke-width="2"/>
  <text x="1152" y="186" fill="#42d6bd" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">STEP 3</text>
  <text x="1152" y="222" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="24">Banks, pensions and</text>
  <text x="1152" y="252" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="24">savers buy them.</text>

  <text x="1126" y="296" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="16">They buy for the interest and the repayment.</text>

  <!-- ROW 2 - what it costs -->
  <rect x="70" y="308" width="1460" height="176" rx="16" fill="#141d26" stroke="#e2574c" stroke-width="2"/>
  <text x="100" y="348" fill="#e2574c" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">SO THE GOVERNMENT GOT THE MONEY NOW — AND OWES THREE THINGS</text>

  <text x="100" y="392" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="24">1.  The money back, at the end.</text>
  <text x="700" y="392" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="24">2.  Interest, every single year.</text>
  <text x="1100" y="392" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="24">3.  It all comes out of tax.</text>

  <text x="100" y="438" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="22">Interest is paid before anything is built. A road that is never repaired still pays interest.</text>
  <text x="100" y="472" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="22">That is not waste. It is what borrowing is: money now, in exchange for less later.</text>

  <!-- ROW 3 - why building stops -->
  <rect x="70" y="508" width="700" height="220" rx="16" fill="#141d26" stroke="#f4bd55" stroke-width="2"/>
  <text x="100" y="548" fill="#f4bd55" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">WHY BUILDING STOPS</text>
  <text x="100" y="590" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="22">Raising tax is slow, and unpopular.</text>
  <text x="100" y="626" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="22">Borrowing works until lenders say no.</text>
  <text x="100" y="672" fill="#e2574c" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">When lenders say no, the building</text>
  <text x="100" y="702" fill="#e2574c" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">stops — whatever the need.</text>

  <rect x="800" y="508" width="730" height="220" rx="16" fill="#141d26" stroke="#42d6bd" stroke-width="2"/>
  <text x="830" y="548" fill="#42d6bd" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">AND A BANK CANNOT FIX IT</text>
  <text x="830" y="590" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="22">A bank lends against something that earns.</text>
  <text x="830" y="626" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="22">A house earns rent. A factory earns sales.</text>
  <text x="830" y="672" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="22">A water main, a clinic, a school: these earn</text>
  <text x="830" y="702" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="22">nothing a lender can collect.</text>

  <!-- punchline -->
  <rect x="70" y="752" width="1460" height="112" rx="14" fill="#0b1116" stroke="#42d6bd" stroke-width="2"/>
  <text x="100" y="796" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="25">So public building competes with housing and business for the same borrowed money —</text>
  <text x="100" y="834" fill="#42d6bd" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">and loses, because it cannot pay the interest back on its own.</text>
</svg>
