<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <marker id="a1" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8fa6b2"/>
    </marker>
    <marker id="a2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#42d6bd"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0b1116"/>

  <text x="80" y="92" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">Who actually creates money</text>
  <text x="80" y="134" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="22">Frame 1 — two creators, and almost nobody knows the second one</text>

  <!-- MYTH -->
  <rect x="70" y="176" width="520" height="150" rx="14" fill="#141d26" stroke="#e2574c" stroke-width="2"/>
  <text x="100" y="220" fill="#e2574c" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">THE MYTH</text>
  <text x="100" y="260" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="24">Banks lend out money that</text>
  <text x="100" y="292" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="24">savers deposited with them.</text>
  <line x1="96" y1="250" x2="556" y2="288" stroke="#e2574c" stroke-width="4"/>

  <!-- CREATOR 1 -->
  <rect x="660" y="176" width="870" height="150" rx="14" fill="#141d26" stroke="#7c6cff" stroke-width="2"/>
  <text x="692" y="220" fill="#7c6cff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">CREATOR ONE — THE CENTRAL BANK</text>
  <text x="692" y="260" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="24">It creates reserves: digital balances banks settle in.</text>
  <text x="692" y="294" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="21">This is how the state is funded when it does not tax first.</text>

  <!-- CREATOR 2 -->
  <rect x="660" y="346" width="870" height="150" rx="14" fill="#141d26" stroke="#42d6bd" stroke-width="2"/>
  <text x="692" y="390" fill="#42d6bd" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">CREATOR TWO — ANY COMMERCIAL BANK</text>
  <text x="692" y="430" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="24">When it makes a loan, it creates the deposit at the same moment.</text>
  <text x="692" y="464" fill="#8fa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="21">The money did not exist before the loan.</text>

  <!-- the tests -->
  <rect x="70" y="530" width="1460" height="150" rx="16" fill="#141d26" stroke="#f4bd55" stroke-width="2"/>
  <text x="104" y="574" fill="#f4bd55" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">SO WHAT LIMITS EACH ONE?</text>
  <text x="104" y="618" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="24">The central bank: an inflation target, a mandate, and law.</text>
  <text x="104" y="656" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="24">The commercial bank: what it will accept as security — a wage, a house, a business that earns.</text>

  <!-- consequence -->
  <rect x="70" y="716" width="1460" height="120" rx="14" fill="#0b1116" stroke="#42d6bd" stroke-width="2"/>
  <text x="104" y="762" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="26">Money is created in both places all the time. The argument was never</text>
  <text x="104" y="800" fill="#42d6bd" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">whether to create it. It is who decides where it goes, and against what.</text>

</svg>
